# AI Kids Creator Academy — Frontend container
# Build: docker compose build
# Run:   docker compose up -d
#
# Local dev (default): nginx proxies /api/* → http://host.docker.internal:5100
# Point at any hub:   STORYMEE_HUB_UPSTREAM=http://hub.storymee.com docker compose up -d
#
# Production (Vercel): set VITE_API_URL at BUILD time so browser calls hub directly.
# In that case this compose file is not used.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Leave empty for Docker-proxy mode (FE calls relative /api/).
        # Set to https://hub.storymee.com for cross-domain prod builds.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: aikids-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Runtime: nginx envsubst replaces ${STORYMEE_HUB_UPSTREAM} in nginx.conf
      # Local dev:    http://host.docker.internal:5100  (default — reaches hub on your machine)
      # Same-network: http://storymee-hub:5100          (when hub runs in same Docker network)
      STORYMEE_HUB_UPSTREAM: ${STORYMEE_HUB_UPSTREAM:-http://host.docker.internal:5100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
