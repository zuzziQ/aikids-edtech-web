<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 473" width="840" height="473" role="img" aria-label="BattleMath — Pháo Đài Kiểm Chứng trong màn đêm huyền bí">
  <defs>
    <!-- Sky gradient: deep navy to purple twilight -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="60%" stop-color="#1e1050"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e3d"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <!-- Fortress glow -->
    <radialGradient id="fortressGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d5efc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <!-- Fog glow -->
    <radialGradient id="fogGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#3dbfff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3dbfff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shield beam -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc94a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc94a" stop-opacity="0"/>
    </linearGradient>
    <!-- Star filter -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Purple glow filter -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Fog texture -->
    <filter id="fogFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="840" height="473" fill="url(#sky)"/>

  <!-- Stars scattered across sky -->
  <g filter="url(#starGlow)" opacity="0.9">
    <circle cx="42" cy="28" r="1.2" fill="#fff"/>
    <circle cx="120" cy="52" r="0.8" fill="#fff"/>
    <circle cx="200" cy="18" r="1.5" fill="#fff"/>
    <circle cx="280" cy="44" r="1.0" fill="#fff"/>
    <circle cx="360" cy="22" r="0.7" fill="#c4b5fd"/>
    <circle cx="440" cy="38" r="1.3" fill="#fff"/>
    <circle cx="520" cy="15" r="0.9" fill="#fff"/>
    <circle cx="600" cy="48" r="1.1" fill="#c4b5fd"/>
    <circle cx="680" cy="24" r="1.4" fill="#fff"/>
    <circle cx="760" cy="40" r="0.8" fill="#fff"/>
    <circle cx="800" cy="12" r="1.2" fill="#fff"/>
    <circle cx="88" cy="80" r="0.9" fill="#c4b5fd"/>
    <circle cx="320" cy="70" r="1.0" fill="#fff"/>
    <circle cx="500" cy="62" r="0.7" fill="#fff"/>
    <circle cx="740" cy="72" r="1.2" fill="#c4b5fd"/>
    <!-- Twinkling larger stars -->
    <circle cx="160" cy="35" r="2" fill="#ffc94a" opacity="0.8"/>
    <circle cx="720" cy="30" r="2.2" fill="#ffc94a" opacity="0.7"/>
  </g>

  <!-- Moon (crescent) -->
  <g transform="translate(740, 60)">
    <circle r="32" fill="#ffd97d" opacity="0.9"/>
    <circle cx="12" cy="-8" r="26" fill="#1e1050"/>
    <!-- Moon glow ring -->
    <circle r="38" fill="none" stroke="#ffd97d" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Distant mountains (silhouette) -->
  <polygon points="0,280 80,200 160,240 240,170 320,210 400,160 480,200 560,155 640,195 720,165 800,200 840,180 840,320 0,320" fill="#120b35"/>

  <!-- Ground plateau -->
  <rect x="0" y="310" width="840" height="163" fill="url(#ground)"/>

  <!-- Fog overlay at base (magical mist) -->
  <ellipse cx="420" cy="320" rx="460" ry="60" fill="#3dbfff" opacity="0.06" filter="url(#fogFilter)"/>
  <ellipse cx="420" cy="340" rx="400" ry="45" fill="#6d5efc" opacity="0.08" filter="url(#fogFilter)"/>

  <!-- === FORTRESS === -->
  <!-- Main fortress base platform -->
  <rect x="280" y="290" width="280" height="30" rx="8" fill="#2d1b69"/>
  <rect x="270" y="282" width="300" height="16" rx="6" fill="#3d2480"/>

  <!-- Central tower body -->
  <rect x="350" y="170" width="140" height="140" rx="10" fill="#2d1b69"/>
  <!-- Tower layers -->
  <rect x="340" y="190" width="160" height="20" rx="5" fill="#3d2480"/>
  <rect x="345" y="230" width="150" height="8" rx="4" fill="#3d2480" opacity="0.7"/>
  <rect x="345" y="258" width="150" height="8" rx="4" fill="#3d2480" opacity="0.7"/>

  <!-- Tower battlements (merlon pattern) -->
  <rect x="350" y="155" width="22" height="24" rx="4" fill="#2d1b69"/>
  <rect x="382" y="155" width="22" height="24" rx="4" fill="#2d1b69"/>
  <rect x="414" y="155" width="22" height="24" rx="4" fill="#2d1b69"/>
  <rect x="446" y="155" width="22" height="24" rx="4" fill="#2d1b69"/>

  <!-- Central tower gate -->
  <rect x="395" y="250" width="50" height="60" rx="25" fill="#0d0820"/>
  <!-- Gate arch glow -->
  <ellipse cx="420" cy="252" rx="26" ry="6" fill="#6d5efc" opacity="0.6"/>

  <!-- Left wing tower -->
  <rect x="280" y="220" width="80" height="100" rx="8" fill="#231559"/>
  <rect x="275" y="208" width="90" height="16" rx="5" fill="#3d2480"/>
  <!-- Left battlements -->
  <rect x="280" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <rect x="302" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <rect x="324" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <!-- Left tower window (lit) -->
  <ellipse cx="320" cy="248" rx="12" ry="16" fill="#0d0820"/>
  <ellipse cx="320" cy="248" rx="9" ry="13" fill="#ffc94a" opacity="0.4"/>

  <!-- Right wing tower -->
  <rect x="480" y="220" width="80" height="100" rx="8" fill="#231559"/>
  <rect x="475" y="208" width="90" height="16" rx="5" fill="#3d2480"/>
  <!-- Right battlements -->
  <rect x="480" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <rect x="502" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <rect x="524" y="196" width="16" height="18" rx="3" fill="#231559"/>
  <!-- Right tower window (lit) -->
  <ellipse cx="520" cy="248" rx="12" ry="16" fill="#0d0820"/>
  <ellipse cx="520" cy="248" rx="9" ry="13" fill="#6d5efc" opacity="0.5"/>

  <!-- Fortress glow aura -->
  <ellipse cx="420" cy="240" rx="180" ry="80" fill="url(#fortressGlow)"/>

  <!-- === SHIELD BEAM (verification ray) === -->
  <!-- Central beam shooting upward from tower top -->
  <rect x="416" y="60" width="8" height="100" rx="4" fill="url(#beam)" opacity="0.85"/>
  <!-- Beam widening effect -->
  <polygon points="414,60 426,60 432,155 408,155" fill="#ffc94a" opacity="0.2"/>

  <!-- Shield symbol at beam top -->
  <g transform="translate(420, 48) scale(1.2)">
    <path d="M0,-20 L14,-12 L14,4 L0,14 L-14,4 L-14,-12 Z" fill="#ffc94a" opacity="0.9"/>
    <path d="M0,-14 L9,-8 L9,2 L0,10 L-9,2 L-9,-8 Z" fill="#fff" opacity="0.8"/>
    <!-- Check mark in shield -->
    <path d="M-5,0 L-1,4 L6,-5" stroke="#ffc94a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- === FLOATING QUESTION MARKS (Sương Mù elements) === -->
  <!-- Fog card left -->
  <g transform="translate(140, 220)" opacity="0.85">
    <rect x="-36" y="-48" width="72" height="88" rx="14" fill="#231559" stroke="#6d5efc" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="32" fill="#6d5efc" font-family="serif">?</text>
    <text x="0" y="22" text-anchor="middle" font-size="10" fill="#c4b5fd" font-family="sans-serif" font-weight="bold">AI Output</text>
    <!-- Glow -->
    <rect x="-36" y="-48" width="72" height="88" rx="14" fill="none" stroke="#6d5efc" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Fog card right -->
  <g transform="translate(700, 235)" opacity="0.75">
    <rect x="-36" y="-48" width="72" height="88" rx="14" fill="#231559" stroke="#3dbfff" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="32" fill="#3dbfff" font-family="serif">✓</text>
    <text x="0" y="22" text-anchor="middle" font-size="10" fill="#93c5fd" font-family="sans-serif" font-weight="bold">Verified</text>
  </g>

  <!-- Small floating icons (magnifying glass, stars) -->
  <g transform="translate(200, 160)" opacity="0.7">
    <circle r="18" fill="#2d1b69"/>
    <circle r="12" fill="none" stroke="#ffc94a" stroke-width="2.5"/>
    <line x1="9" y1="9" x2="14" y2="14" stroke="#ffc94a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(640, 175)" opacity="0.65">
    <circle r="18" fill="#1e1050"/>
    <!-- Star shape -->
    <path d="M0,-12 L3,-4 L12,-4 L5,2 L8,11 L0,6 L-8,11 L-5,2 L-12,-4 L-3,-4 Z" fill="#ffc94a" opacity="0.9"/>
  </g>

  <!-- Sparkle particles floating -->
  <g opacity="0.7">
    <circle cx="100" cy="260" r="3" fill="#6d5efc"/>
    <circle cx="108" cy="255" r="1.5" fill="#c4b5fd"/>
    <circle cx="96" cy="253" r="1.5" fill="#c4b5fd"/>

    <circle cx="730" cy="260" r="3" fill="#3dbfff"/>
    <circle cx="738" cy="255" r="1.5" fill="#93c5fd"/>
    <circle cx="724" cy="253" r="1.5" fill="#93c5fd"/>

    <circle cx="420" cy="90" r="2.5" fill="#ffc94a"/>
    <circle cx="410" cy="84" r="1.5" fill="#fde68a"/>
    <circle cx="430" cy="84" r="1.5" fill="#fde68a"/>
  </g>

  <!-- Bottom fog wisps -->
  <ellipse cx="150" cy="380" rx="140" ry="30" fill="#6d5efc" opacity="0.07" filter="url(#fogFilter)"/>
  <ellipse cx="680" cy="390" rx="160" ry="28" fill="#3dbfff" opacity="0.06" filter="url(#fogFilter)"/>

  <!-- Ground detail: glowing runes/paths -->
  <line x1="280" y1="320" x2="560" y2="320" stroke="#6d5efc" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="420" cy="320" r="6" fill="#6d5efc" opacity="0.5"/>
  <circle cx="300" cy="320" r="3" fill="#6d5efc" opacity="0.3"/>
  <circle cx="540" cy="320" r="3" fill="#6d5efc" opacity="0.3"/>

  <!-- Title watermark (bottom right, subtle) -->
  <text x="818" y="462" text-anchor="end" font-size="11" fill="#c4b5fd" opacity="0.4" font-family="sans-serif" font-weight="bold">StoryMee · BattleMath</text>
</svg>
