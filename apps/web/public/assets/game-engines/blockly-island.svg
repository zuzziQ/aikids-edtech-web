<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 473" width="840" height="473" role="img" aria-label="BlocklyMaze — Hòn đảo lập trình nổi giữa bầu trời xanh">
  <defs>
    <!-- Sky gradient: soft dawn blue to mint -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#a5f3d4"/>
    </linearGradient>
    <!-- Island top gradient -->
    <linearGradient id="islandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Island body gradient -->
    <linearGradient id="islandBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#5c2d0a"/>
    </linearGradient>
    <!-- Grid path glow -->
    <linearGradient id="pathGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ed9a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3ed9a0"/>
      <stop offset="100%" stop-color="#3ed9a0" stop-opacity="0"/>
    </linearGradient>
    <!-- Robot glow -->
    <radialGradient id="robotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d5efc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <!-- Data crystal glow -->
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b93" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff7b93" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloud filter soft -->
    <filter id="cloudShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#bae6fd" flood-opacity="0.5"/>
    </filter>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="840" height="473" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="80" cy="70" r="48" fill="#fbbf24" opacity="0.9"/>
  <circle cx="80" cy="70" r="40" fill="#fde68a"/>
  <!-- Sun rays -->
  <g stroke="#fde68a" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="80" y1="10" x2="80" y2="2"/>
    <line x1="80" y1="130" x2="80" y2="138"/>
    <line x1="20" y1="70" x2="12" y2="70"/>
    <line x1="140" y1="70" x2="148" y2="70"/>
    <line x1="38" y1="28" x2="32" y2="22"/>
    <line x1="122" y1="112" x2="128" y2="118"/>
    <line x1="38" y1="112" x2="32" y2="118"/>
    <line x1="122" y1="28" x2="128" y2="22"/>
  </g>

  <!-- Clouds (fluffy) -->
  <g filter="url(#cloudShadow)" opacity="0.92">
    <!-- Cloud 1 -->
    <g transform="translate(600, 55)">
      <ellipse cx="0" cy="0" rx="70" ry="28" fill="white"/>
      <ellipse cx="-30" cy="-8" rx="40" ry="24" fill="white"/>
      <ellipse cx="30" cy="-6" rx="44" ry="22" fill="white"/>
      <ellipse cx="0" cy="-12" rx="36" ry="20" fill="white"/>
    </g>
    <!-- Cloud 2 -->
    <g transform="translate(200, 80)">
      <ellipse cx="0" cy="0" rx="55" ry="22" fill="white"/>
      <ellipse cx="-22" cy="-6" rx="32" ry="18" fill="white"/>
      <ellipse cx="22" cy="-5" rx="34" ry="17" fill="white"/>
      <ellipse cx="0" cy="-10" rx="28" ry="16" fill="white"/>
    </g>
    <!-- Cloud 3 -->
    <g transform="translate(760, 120)">
      <ellipse cx="0" cy="0" rx="48" ry="20" fill="white" opacity="0.8"/>
      <ellipse cx="-20" cy="-5" rx="30" ry="16" fill="white" opacity="0.8"/>
      <ellipse cx="20" cy="-4" rx="32" ry="15" fill="white" opacity="0.8"/>
    </g>
  </g>

  <!-- Small floating secondary island (top-right) -->
  <g transform="translate(680, 155)">
    <ellipse cx="0" cy="12" rx="55" ry="14" fill="#92400e" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="55" ry="12" fill="#16a34a" opacity="0.8"/>
    <!-- Mini tree -->
    <ellipse cx="-10" cy="-16" rx="14" ry="18" fill="#15803d"/>
    <rect x="-13" y="-3" width="6" height="10" rx="2" fill="#92400e"/>
    <!-- Mini tree 2 -->
    <ellipse cx="18" cy="-12" rx="11" ry="14" fill="#22c55e"/>
    <rect x="15" y="0" width="5" height="8" rx="2" fill="#92400e"/>
  </g>

  <!-- === MAIN ISLAND === -->
  <!-- Island shadow/depth -->
  <ellipse cx="420" cy="400" rx="220" ry="22" fill="#0d4a1a" opacity="0.2"/>

  <!-- Island rocky body -->
  <path d="M200,360 Q210,310 260,300 Q300,295 420,298 Q540,295 580,300 Q630,310 640,360 Z" fill="url(#islandBody)"/>

  <!-- Island grassy top surface -->
  <path d="M200,360 Q210,290 260,280 Q300,272 420,276 Q540,272 580,280 Q630,290 640,360 Q530,375 420,378 Q310,375 200,360 Z" fill="url(#islandTop)"/>
  <!-- Grass highlights -->
  <path d="M210,340 Q220,300 265,292 Q310,285 420,288 Q530,285 575,292 Q620,300 630,340" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>

  <!-- === GRID (5x5 maze path) on island === -->
  <g transform="translate(310, 292)">
    <!-- Grid cells background -->
    <rect x="0" y="0" width="220" height="130" rx="12" fill="#dcfce7" opacity="0.85"/>

    <!-- Grid lines -->
    <g stroke="#bbf7d0" stroke-width="1.5" opacity="0.8">
      <!-- Vertical lines -->
      <line x1="44" y1="0" x2="44" y2="130"/>
      <line x1="88" y1="0" x2="88" y2="130"/>
      <line x1="132" y1="0" x2="132" y2="130"/>
      <line x1="176" y1="0" x2="176" y2="130"/>
      <!-- Horizontal lines -->
      <line x1="0" y1="26" x2="220" y2="26"/>
      <line x1="0" y1="52" x2="220" y2="52"/>
      <line x1="0" y1="78" x2="220" y2="78"/>
      <line x1="0" y1="104" x2="220" y2="104"/>
    </g>

    <!-- Rocks (obstacles) - darker cells -->
    <rect x="44" y="26" width="44" height="26" rx="4" fill="#a3e635" opacity="0.4"/>
    <rect x="132" y="52" width="44" height="26" rx="4" fill="#a3e635" opacity="0.4"/>
    <rect x="88" y="78" width="44" height="26" rx="4" fill="#a3e635" opacity="0.4"/>

    <!-- Highlight path cells (trail the robot takes) -->
    <rect x="0" y="0" width="44" height="26" rx="4" fill="#3ed9a0" opacity="0.3"/>
    <rect x="0" y="26" width="44" height="26" rx="4" fill="#3ed9a0" opacity="0.3"/>
    <rect x="0" y="52" width="44" height="26" rx="4" fill="#3ed9a0" opacity="0.3"/>
    <rect x="44" y="52" width="44" height="26" rx="4" fill="#3ed9a0" opacity="0.3"/>
    <rect x="44" y="78" width="44" height="26" rx="4" fill="#3ed9a0" opacity="0.25"/>

    <!-- Data goal marker (coral) -->
    <g transform="translate(192, 113)">
      <circle r="14" fill="#ff7b93" opacity="0.9"/>
      <text text-anchor="middle" y="5" font-size="14" fill="white">💾</text>
    </g>

    <!-- Grid border -->
    <rect x="0" y="0" width="220" height="130" rx="12" fill="none" stroke="#3ed9a0" stroke-width="2.5"/>
  </g>

  <!-- === ROBOT (Mii) on grid === -->
  <g transform="translate(342, 302)" filter="url(#softGlow)">
    <!-- Robot glow -->
    <circle r="22" fill="url(#robotGlow)"/>
    <!-- Robot body: rounded square with brand color -->
    <rect x="-16" y="-18" width="32" height="32" rx="8" fill="#6d5efc"/>
    <!-- Navigation arrow inside robot -->
    <path d="M0,-10 L8,6 L0,2 L-8,6 Z" fill="white" transform="rotate(0)"/>
    <!-- Robot eyes -->
    <circle cx="-5" cy="-4" r="3" fill="white"/>
    <circle cx="5" cy="-4" r="3" fill="white"/>
    <circle cx="-4" cy="-3" r="1.5" fill="#1e2740"/>
    <circle cx="6" cy="-3" r="1.5" fill="#1e2740"/>
    <!-- Antenna -->
    <line x1="0" y1="-18" x2="0" y2="-26" stroke="#6d5efc" stroke-width="2"/>
    <circle cx="0" cy="-27" r="3" fill="#ffc94a"/>
  </g>

  <!-- === TREES on island === -->
  <!-- Tree 1 left -->
  <g transform="translate(230, 298)">
    <rect x="-6" y="0" width="12" height="28" rx="4" fill="#92400e"/>
    <ellipse cx="0" cy="-14" rx="24" ry="28" fill="#15803d"/>
    <ellipse cx="0" cy="-20" rx="18" ry="22" fill="#16a34a"/>
    <ellipse cx="0" cy="-26" rx="12" ry="16" fill="#22c55e"/>
  </g>
  <!-- Tree 2 right -->
  <g transform="translate(610, 298)">
    <rect x="-6" y="0" width="12" height="28" rx="4" fill="#92400e"/>
    <ellipse cx="0" cy="-14" rx="24" ry="28" fill="#15803d"/>
    <ellipse cx="0" cy="-20" rx="18" ry="22" fill="#16a34a"/>
    <ellipse cx="0" cy="-26" rx="12" ry="16" fill="#22c55e"/>
  </g>

  <!-- === FLOATING CODE BLOCKS === -->
  <!-- Left code block (command block) -->
  <g transform="translate(120, 200)">
    <rect x="-38" y="-22" width="76" height="42" rx="10" fill="#6d5efc"/>
    <rect x="-38" y="-22" width="10" height="42" rx="5" fill="#5b4ee0"/>
    <text x="8" y="-4" text-anchor="middle" font-size="11" fill="white" font-family="monospace" font-weight="bold">→ Tiến</text>
    <text x="8" y="12" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="monospace">move(1)</text>
  </g>
  <!-- Connecting arrow -->
  <path d="M160,200 Q200,190 220,210" stroke="#3ed9a0" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowHead)" opacity="0.6"/>

  <!-- Right code block (turn block) -->
  <g transform="translate(720, 185)">
    <rect x="-38" y="-22" width="76" height="42" rx="10" fill="#3dbfff"/>
    <rect x="-38" y="-22" width="10" height="42" rx="5" fill="#2aa8e8"/>
    <text x="8" y="-4" text-anchor="middle" font-size="11" fill="white" font-family="monospace" font-weight="bold">↻ Quay</text>
    <text x="8" y="12" text-anchor="middle" font-size="11" fill="#e0f2fe" font-family="monospace">turn('R')</text>
  </g>

  <!-- Data network lines (connecting floating blocks to island) -->
  <g opacity="0.4">
    <path d="M158,200 Q280,280 360,310" stroke="#3ed9a0" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <path d="M682,185 Q600,270 540,310" stroke="#6d5efc" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  </g>

  <!-- Sparkle dots -->
  <g opacity="0.8">
    <circle cx="160" cy="130" r="4" fill="#ffc94a"/>
    <circle cx="166" cy="124" r="2" fill="#fde68a"/>
    <circle cx="154" cy="124" r="2" fill="#fde68a"/>

    <circle cx="700" cy="145" r="4" fill="#3ed9a0"/>
    <circle cx="706" cy="139" r="2" fill="#6ee7b7"/>
    <circle cx="694" cy="139" r="2" fill="#6ee7b7"/>
  </g>

  <!-- Title watermark -->
  <text x="818" y="462" text-anchor="end" font-size="11" fill="#15803d" opacity="0.35" font-family="sans-serif" font-weight="bold">StoryMee · BlocklyMaze</text>
</svg>
