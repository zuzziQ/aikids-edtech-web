<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 473" width="840" height="473" role="img" aria-label="MathKids — Vũ trụ toán học mini với các hành tinh số và sao băng">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="deepSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0c0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Planet 1: brand purple -->
    <radialGradient id="planet1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <!-- Planet 2: coral/red -->
    <radialGradient id="planet2" cx="30%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <!-- Planet 3: mint/teal -->
    <radialGradient id="planet3" cx="32%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <!-- Planet 4: sun yellow -->
    <radialGradient id="planet4" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Planet 5: sky blue (central big) -->
    <radialGradient id="planet5" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <!-- Shooting star gradient -->
    <linearGradient id="shootingStar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <!-- Orbit ring gradient -->
    <linearGradient id="orbitRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Nebula glow -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Star glow filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Math number glow -->
    <filter id="mathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="840" height="473" fill="url(#deepSpace)"/>

  <!-- Nebula clouds (background atmosphere) -->
  <ellipse cx="200" cy="150" rx="200" ry="130" fill="url(#nebula1)" opacity="0.8"/>
  <ellipse cx="650" cy="300" rx="220" ry="150" fill="url(#nebula2)" opacity="0.7"/>
  <ellipse cx="420" cy="380" rx="280" ry="100" fill="url(#nebula1)" opacity="0.4"/>

  <!-- Stars (lots of tiny dots) -->
  <g filter="url(#starGlow)">
    <!-- Dense starfield -->
    <circle cx="30" cy="20" r="1" fill="white" opacity="0.9"/>
    <circle cx="85" cy="45" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="140" cy="15" r="1.2" fill="white"/>
    <circle cx="190" cy="60" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="250" cy="30" r="1" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="300" cy="55" r="0.9" fill="white"/>
    <circle cx="360" cy="20" r="1.1" fill="white"/>
    <circle cx="420" cy="40" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="475" cy="18" r="1.3" fill="#c4b5fd"/>
    <circle cx="535" cy="50" r="0.8" fill="white"/>
    <circle cx="590" cy="25" r="1" fill="white" opacity="0.9"/>
    <circle cx="645" cy="48" r="1.2" fill="white"/>
    <circle cx="700" cy="18" r="0.9" fill="#bae6fd" opacity="0.9"/>
    <circle cx="755" cy="42" r="1.1" fill="white"/>
    <circle cx="810" cy="22" r="0.8" fill="white" opacity="0.8"/>
    <circle cx="55" cy="90" r="0.9" fill="#fde68a" opacity="0.8"/>
    <circle cx="160" cy="100" r="1" fill="white"/>
    <circle cx="220" cy="80" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="380" cy="95" r="0.8" fill="white"/>
    <circle cx="480" cy="75" r="1.1" fill="#c4b5fd"/>
    <circle cx="600" cy="85" r="0.9" fill="white" opacity="0.9"/>
    <circle cx="730" cy="78" r="1" fill="white"/>
    <circle cx="800" cy="95" r="0.8" fill="white" opacity="0.7"/>
    <!-- Lower half stars -->
    <circle cx="20" cy="300" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="60" cy="340" r="1" fill="#bae6fd" opacity="0.7"/>
    <circle cx="120" cy="380" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="750" cy="320" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="790" cy="360" r="1.1" fill="#c4b5fd" opacity="0.7"/>
    <circle cx="820" cy="400" r="0.8" fill="white" opacity="0.5"/>
  </g>

  <!-- === SHOOTING STARS === -->
  <g opacity="0.8">
    <!-- Shooting star 1 -->
    <line x1="640" y1="55" x2="720" y2="80" stroke="url(#shootingStar)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="720" cy="80" r="2.5" fill="white"/>
    <!-- Shooting star 2 -->
    <line x1="80" y1="130" x2="160" y2="150" stroke="url(#shootingStar)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="160" cy="150" r="2" fill="white"/>
  </g>

  <!-- === ORBIT RINGS around central planet === -->
  <!-- Outer orbit ring -->
  <ellipse cx="420" cy="240" rx="200" ry="55" fill="none" stroke="url(#orbitRing)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Inner orbit ring -->
  <ellipse cx="420" cy="240" rx="130" ry="35" fill="none" stroke="url(#orbitRing)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- === PLANETS === -->
  <!-- Planet 5: Central large (sky blue) — Saturn-like with ring -->
  <g transform="translate(420, 240)" filter="url(#glow)">
    <!-- Saturn ring (behind) -->
    <ellipse cx="0" cy="0" rx="80" ry="18" fill="none" stroke="#93c5fd" stroke-width="10" opacity="0.35"/>
    <!-- Planet body -->
    <circle r="58" fill="url(#planet5)"/>
    <!-- Planet surface stripes -->
    <ellipse cx="0" cy="-18" rx="55" ry="10" fill="#60a5fa" opacity="0.25"/>
    <ellipse cx="0" cy="2" rx="55" ry="8" fill="#1d4ed8" opacity="0.2"/>
    <ellipse cx="0" cy="20" rx="55" ry="10" fill="#3b82f6" opacity="0.2"/>
    <!-- Saturn ring (front) -->
    <ellipse cx="0" cy="0" rx="80" ry="18" fill="none" stroke="#bfdbfe" stroke-width="5" opacity="0.25" clip-path="inset(50% 0 0 0)"/>
    <!-- Math number on planet -->
    <text text-anchor="middle" y="8" font-size="28" fill="white" font-weight="bold" font-family="sans-serif">+</text>
  </g>

  <!-- Planet 1: upper-left (purple) -->
  <g transform="translate(185, 155)">
    <circle r="36" fill="url(#planet1)"/>
    <!-- Craters -->
    <circle cx="-12" cy="-10" r="6" fill="#4c1d95" opacity="0.5"/>
    <circle cx="10" cy="8" r="4" fill="#4c1d95" opacity="0.4"/>
    <!-- Math number -->
    <text text-anchor="middle" y="8" font-size="22" fill="white" font-weight="bold" font-family="sans-serif">7</text>
  </g>

  <!-- Planet 2: upper-right (coral) — orbiting -->
  <g transform="translate(620, 185)">
    <circle r="28" fill="url(#planet2)"/>
    <circle cx="-8" cy="-8" r="5" fill="#881337" opacity="0.4"/>
    <text text-anchor="middle" y="7" font-size="20" fill="white" font-weight="bold" font-family="sans-serif">3</text>
  </g>

  <!-- Planet 3: lower-right (mint) — orbiting -->
  <g transform="translate(618, 305)">
    <circle r="24" fill="url(#planet3)"/>
    <text text-anchor="middle" y="6" font-size="18" fill="white" font-weight="bold" font-family="sans-serif">×</text>
  </g>

  <!-- Planet 4: lower-left (sun yellow) — orbiting -->
  <g transform="translate(222, 308)">
    <circle r="22" fill="url(#planet4)"/>
    <!-- Planet ring mini -->
    <ellipse cx="0" cy="0" rx="32" ry="7" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.4"/>
    <text text-anchor="middle" y="6" font-size="18" fill="white" font-weight="bold" font-family="sans-serif">5</text>
  </g>

  <!-- Planet 6: tiny right mid (teal) -->
  <g transform="translate(760, 240)">
    <circle r="16" fill="url(#planet3)" opacity="0.9"/>
    <text text-anchor="middle" y="5" font-size="13" fill="white" font-weight="bold" font-family="sans-serif">÷</text>
  </g>

  <!-- Planet 7: tiny left (purple small) -->
  <g transform="translate(88, 240)">
    <circle r="14" fill="url(#planet1)" opacity="0.85"/>
    <text text-anchor="middle" y="5" font-size="12" fill="white" font-weight="bold" font-family="sans-serif">2</text>
  </g>

  <!-- === FLOATING MATH EQUATIONS === -->
  <!-- Equation panel 1 (top, glowing card) -->
  <g transform="translate(420, 95)" filter="url(#mathGlow)">
    <rect x="-72" y="-22" width="144" height="44" rx="12" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2" opacity="0.95"/>
    <text text-anchor="middle" y="7" font-size="22" fill="white" font-family="sans-serif" font-weight="bold">7 + 3 = ?</text>
  </g>

  <!-- Answer options floating (like number bubbles) -->
  <!-- Answer A: wrong -->
  <g transform="translate(325, 165)">
    <circle r="24" fill="#1e1b4b" stroke="#6d5efc" stroke-width="2"/>
    <text text-anchor="middle" y="7" font-size="18" fill="#c4b5fd" font-family="sans-serif" font-weight="bold">8</text>
  </g>
  <!-- Answer B: correct (glowing gold) -->
  <g transform="translate(420, 155)" filter="url(#glow)">
    <circle r="28" fill="#ffc94a"/>
    <circle r="24" fill="#fbbf24"/>
    <!-- Star ring around correct answer -->
    <circle r="34" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6"/>
    <text text-anchor="middle" y="8" font-size="20" fill="#1e2740" font-family="sans-serif" font-weight="bold">10</text>
    <!-- Check mark -->
    <g transform="translate(20, -18)">
      <circle r="9" fill="#3ed9a0"/>
      <path d="M-5,0 L-1,4 L6,-5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>
  <!-- Answer C: wrong -->
  <g transform="translate(515, 165)">
    <circle r="24" fill="#1e1b4b" stroke="#6d5efc" stroke-width="2"/>
    <text text-anchor="middle" y="7" font-size="18" fill="#c4b5fd" font-family="sans-serif" font-weight="bold">12</text>
  </g>

  <!-- === ROCKET / SPACESHIP === -->
  <g transform="translate(80, 290) rotate(-25)">
    <!-- Rocket body -->
    <path d="M0,-40 Q12,-30 12,10 L6,20 L-6,20 L-12,10 Q-12,-30 0,-40 Z" fill="#6d5efc"/>
    <!-- Rocket nose cone -->
    <path d="M0,-40 Q6,-48 0,-56 Q-6,-48 0,-40 Z" fill="#c4b5fd"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-10" r="7" fill="#3dbfff" stroke="white" stroke-width="2"/>
    <!-- Rocket fins -->
    <path d="M12,10 Q22,20 16,25 L6,20 Z" fill="#5b4ee0"/>
    <path d="M-12,10 Q-22,20 -16,25 L-6,20 Z" fill="#5b4ee0"/>
    <!-- Rocket exhaust (3 flame tips) -->
    <path d="M-6,20 Q-4,35 0,40 Q4,35 6,20 Z" fill="#ffc94a" opacity="0.9"/>
    <path d="M-10,18 Q-12,30 -8,36 L-6,20 Z" fill="#f97316" opacity="0.7"/>
    <path d="M10,18 Q12,30 8,36 L6,20 Z" fill="#f97316" opacity="0.7"/>
  </g>

  <!-- Rocket trail -->
  <path d="M90,310 Q110,320 140,330" stroke="#ffc94a" stroke-width="3" stroke-linecap="round" opacity="0.5" stroke-dasharray="6 4"/>
  <path d="M85,320 Q106,332 136,344" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.3" stroke-dasharray="4 6"/>

  <!-- Comet -->
  <g transform="translate(700, 130) rotate(30)">
    <circle r="12" fill="white" opacity="0.9"/>
    <path d="M12,0 Q40,15 80,10 Q50,0 40,-8 Z" fill="white" opacity="0.4"/>
    <path d="M12,0 Q45,20 88,18 Q55,5 44,-6 Z" fill="white" opacity="0.25"/>
  </g>

  <!-- Sparkle stars near correct answer -->
  <g opacity="0.8">
    <circle cx="460" cy="110" r="3" fill="#fde68a"/>
    <circle cx="470" cy="118" r="2" fill="#fde68a"/>
    <circle cx="378" cy="118" r="3" fill="#c4b5fd"/>
    <circle cx="368" cy="110" r="2" fill="#c4b5fd"/>
  </g>

  <!-- Bottom score display -->
  <g transform="translate(420, 430)" opacity="0.85">
    <rect x="-80" y="-20" width="160" height="38" rx="10" fill="#1e1b4b" stroke="#6d5efc" stroke-width="1.5"/>
    <text x="-30" text-anchor="start" y="5" font-size="14" fill="#ffc94a" font-family="sans-serif" font-weight="bold">⭐ 120 điểm</text>
  </g>

  <!-- Title watermark -->
  <text x="818" y="462" text-anchor="end" font-size="11" fill="#6d5efc" opacity="0.4" font-family="sans-serif" font-weight="bold">StoryMee · MathOrbit</text>
</svg>
