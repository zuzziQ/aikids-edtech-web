<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 473" width="840" height="473" role="img" aria-label="Edukiz — Khu vườn trí nhớ ma thuật với hoa phát sáng và bướm dữ liệu">
  <defs>
    <!-- Warm sunset sky gradient -->
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="35%" stop-color="#fce7f3"/>
      <stop offset="70%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <!-- Garden ground -->
    <linearGradient id="gardenGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <!-- Garden path -->
    <linearGradient id="gardenPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <!-- Memory card glow -->
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b93" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff7b93" stop-opacity="0"/>
    </radialGradient>
    <!-- Matched card glow -->
    <radialGradient id="matchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ed9a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3ed9a0" stop-opacity="0"/>
    </radialGradient>
    <!-- Flower center glow -->
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc94a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <!-- Soft bokeh filter -->
    <filter id="bokeh" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Petal filter -->
    <filter id="petalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="840" height="473" fill="url(#sunsetSky)"/>

  <!-- Soft bokeh circles in sky (dreamy atmosphere) -->
  <g filter="url(#bokeh)" opacity="0.35">
    <circle cx="100" cy="80" r="40" fill="#f9a8d4"/>
    <circle cx="320" cy="50" r="30" fill="#c4b5fd"/>
    <circle cx="550" cy="90" r="50" fill="#fbcfe8"/>
    <circle cx="750" cy="60" r="35" fill="#f9a8d4"/>
    <circle cx="180" cy="160" r="25" fill="#fde68a"/>
    <circle cx="680" cy="150" r="28" fill="#a7f3d0"/>
  </g>

  <!-- Garden ground area -->
  <ellipse cx="420" cy="430" rx="440" ry="90" fill="url(#gardenGround)"/>
  <ellipse cx="420" cy="430" rx="440" ry="90" fill="url(#gardenGround)"/>
  <!-- Ground detail -->
  <rect x="0" y="380" width="840" height="93" fill="#a7f3d0"/>
  <rect x="0" y="395" width="840" height="78" fill="#6ee7b7"/>

  <!-- Garden path (center winding path) -->
  <path d="M350,473 Q380,420 400,380 Q420,350 420,310" stroke="url(#gardenPath)" stroke-width="42" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Path stones -->
  <g fill="#fde68a" opacity="0.8">
    <ellipse cx="402" cy="460" rx="14" ry="8"/>
    <ellipse cx="408" cy="440" rx="12" ry="7"/>
    <ellipse cx="405" cy="420" rx="13" ry="7"/>
    <ellipse cx="412" cy="400" rx="12" ry="6"/>
    <ellipse cx="415" cy="382" rx="11" ry="6"/>
  </g>

  <!-- === GLOWING FLOWERS (memory symbols) === -->
  <!-- Flower 1 — large pink coral, left area -->
  <g transform="translate(165, 315)" filter="url(#petalGlow)">
    <!-- Stem -->
    <line x1="0" y1="60" x2="0" y2="10" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M0,40 Q20,30 28,38 Q18,48 0,40 Z" fill="#22c55e"/>
    <path d="M0,40 Q-18,30 -24,38 Q-16,48 0,40 Z" fill="#16a34a"/>
    <!-- Petals (8 coral/pink petals) -->
    <g fill="#ff7b93">
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(0)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(45)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(90)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(135)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(180)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(225)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(270)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" transform="rotate(315)"/>
    </g>
    <!-- Center -->
    <circle r="16" fill="url(#flowerGlow)"/>
    <!-- Glow halo -->
    <circle r="26" fill="url(#cardGlow)"/>
    <!-- Center symbol (letter A for memory pair) -->
    <text text-anchor="middle" y="6" font-size="16" fill="white" font-weight="bold" font-family="sans-serif">A</text>
  </g>

  <!-- Flower 2 — medium mint/teal, right area (matched pair) -->
  <g transform="translate(675, 305)" filter="url(#petalGlow)">
    <!-- Stem -->
    <line x1="0" y1="70" x2="0" y2="10" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M0,45 Q22,32 30,42 Q20,52 0,45 Z" fill="#22c55e"/>
    <!-- Petals (6 mint petals) -->
    <g fill="#3ed9a0">
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(0)"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(60)"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(120)"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(180)"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(240)"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" transform="rotate(300)"/>
    </g>
    <!-- Center -->
    <circle r="14" fill="url(#flowerGlow)"/>
    <!-- Match glow halo -->
    <circle r="24" fill="url(#matchGlow)"/>
    <!-- Center symbol -->
    <text text-anchor="middle" y="5" font-size="14" fill="white" font-weight="bold" font-family="sans-serif">A</text>
    <!-- Matched checkmark -->
    <g transform="translate(16, -30)">
      <circle r="10" fill="#3ed9a0"/>
      <path d="M-5,0 L-1,4 L6,-5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Flower 3 — smaller purple, mid-left -->
  <g transform="translate(270, 345)">
    <line x1="0" y1="50" x2="0" y2="8" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <g fill="#c4b5fd">
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(0)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(72)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(144)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(216)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(288)"/>
    </g>
    <circle r="11" fill="#ffc94a"/>
    <text text-anchor="middle" y="4" font-size="11" fill="white" font-weight="bold" font-family="sans-serif">B</text>
  </g>

  <!-- Flower 4 — smaller purple, mid-right (pair to 3) -->
  <g transform="translate(570, 340)">
    <line x1="0" y1="50" x2="0" y2="8" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <g fill="#a78bfa">
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(0)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(72)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(144)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(216)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="15" transform="rotate(288)"/>
    </g>
    <circle r="11" fill="#ffc94a"/>
    <text text-anchor="middle" y="4" font-size="11" fill="white" font-weight="bold" font-family="sans-serif">B</text>
  </g>

  <!-- === MEMORY CARDS (central display) === -->
  <!-- Card face-down (hidden, to be matched) -->
  <g transform="translate(300, 210)">
    <rect x="-40" y="-52" width="80" height="100" rx="16" fill="#6d5efc" stroke="#c4b5fd" stroke-width="2.5"/>
    <!-- Card back pattern (swirl) -->
    <circle cx="0" cy="-2" r="28" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-2" r="18" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="-2" r="8" fill="#a78bfa" opacity="0.5"/>
    <text x="0" y="38" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="sans-serif" font-weight="bold">?</text>
  </g>

  <!-- Card face-up (revealed, matched) -->
  <g transform="translate(540, 205)">
    <rect x="-40" y="-52" width="80" height="100" rx="16" fill="white" stroke="#3ed9a0" stroke-width="3"/>
    <!-- Glow around matched card -->
    <rect x="-40" y="-52" width="80" height="100" rx="16" fill="none" stroke="#3ed9a0" stroke-width="6" opacity="0.3"/>
    <!-- Card content (simple picture: star) -->
    <text x="0" y="-8" text-anchor="middle" font-size="36">⭐</text>
    <text x="0" y="30" text-anchor="middle" font-size="13" fill="#1e2740" font-family="sans-serif" font-weight="bold">Ngôi sao</text>
  </g>

  <!-- === BUTTERFLIES (data butterflies) === -->
  <!-- Butterfly 1 -->
  <g transform="translate(420, 170) rotate(-15)">
    <path d="M0,0 Q-30,-25 -48,-8 Q-38,10 0,0 Z" fill="#ff7b93" opacity="0.85"/>
    <path d="M0,0 Q30,-25 48,-8 Q38,10 0,0 Z" fill="#fda4af" opacity="0.85"/>
    <path d="M0,0 Q-20,18 -30,10 Q-24,-2 0,0 Z" fill="#fb7185" opacity="0.7"/>
    <path d="M0,0 Q20,18 30,10 Q24,-2 0,0 Z" fill="#fda4af" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="4" ry="8" fill="#1e2740"/>
    <!-- Antenna -->
    <line x1="0" y1="-8" x2="-8" y2="-20" stroke="#1e2740" stroke-width="1.5"/>
    <circle cx="-9" cy="-21" r="2.5" fill="#ff7b93"/>
    <line x1="0" y1="-8" x2="8" y2="-20" stroke="#1e2740" stroke-width="1.5"/>
    <circle cx="9" cy="-21" r="2.5" fill="#ff7b93"/>
  </g>

  <!-- Butterfly 2 (smaller, top right) -->
  <g transform="translate(660, 120) rotate(20) scale(0.7)">
    <path d="M0,0 Q-30,-25 -48,-8 Q-38,10 0,0 Z" fill="#c4b5fd" opacity="0.8"/>
    <path d="M0,0 Q30,-25 48,-8 Q38,10 0,0 Z" fill="#ddd6fe" opacity="0.8"/>
    <path d="M0,0 Q-20,18 -30,10 Q-24,-2 0,0 Z" fill="#a78bfa" opacity="0.65"/>
    <path d="M0,0 Q20,18 30,10 Q24,-2 0,0 Z" fill="#c4b5fd" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="4" ry="8" fill="#1e2740"/>
    <line x1="0" y1="-8" x2="-8" y2="-20" stroke="#1e2740" stroke-width="1.5"/>
    <circle cx="-9" cy="-21" r="2.5" fill="#c4b5fd"/>
    <line x1="0" y1="-8" x2="8" y2="-20" stroke="#1e2740" stroke-width="1.5"/>
    <circle cx="9" cy="-21" r="2.5" fill="#c4b5fd"/>
  </g>

  <!-- Butterfly 3 (tiny, left mid) -->
  <g transform="translate(140, 230) rotate(-30) scale(0.55)">
    <path d="M0,0 Q-30,-25 -48,-8 Q-38,10 0,0 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M0,0 Q30,-25 48,-8 Q38,10 0,0 Z" fill="#fde68a" opacity="0.8"/>
    <path d="M0,0 Q-20,18 -30,10 Q-24,-2 0,0 Z" fill="#f59e0b" opacity="0.65"/>
    <path d="M0,0 Q20,18 30,10 Q24,-2 0,0 Z" fill="#fbbf24" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="4" ry="8" fill="#1e2740"/>
  </g>

  <!-- Sparkle trail from butterflies -->
  <g opacity="0.7">
    <circle cx="440" cy="140" r="3" fill="#ffc94a"/>
    <circle cx="450" cy="128" r="2" fill="#fde68a"/>
    <circle cx="460" cy="150" r="2.5" fill="#ffc94a"/>
    <circle cx="630" cy="100" r="2.5" fill="#c4b5fd"/>
    <circle cx="646" cy="108" r="1.8" fill="#ddd6fe"/>
  </g>

  <!-- Small grass tufts at bottom -->
  <g fill="#22c55e" opacity="0.7">
    <path d="M50,395 Q55,370 60,395 Z"/>
    <path d="M58,395 Q64,368 70,395 Z"/>
    <path d="M150,392 Q155,372 160,392 Z"/>
    <path d="M720,392 Q725,372 730,392 Z"/>
    <path d="M780,395 Q785,370 790,395 Z"/>
    <path d="M790,395 Q796,368 802,395 Z"/>
  </g>

  <!-- Garden fireflies / sparkle dots -->
  <g opacity="0.65">
    <circle cx="230" cy="280" r="3" fill="#ffc94a"/>
    <circle cx="360" cy="265" r="2" fill="#3ed9a0"/>
    <circle cx="490" cy="272" r="3" fill="#ff7b93"/>
    <circle cx="620" cy="260" r="2" fill="#c4b5fd"/>
    <circle cx="760" cy="280" r="3" fill="#fde68a"/>
    <circle cx="80" cy="350" r="2.5" fill="#6d5efc" opacity="0.8"/>
  </g>

  <!-- Title watermark -->
  <text x="818" y="462" text-anchor="end" font-size="11" fill="#db2777" opacity="0.35" font-family="sans-serif" font-weight="bold">StoryMee · EdukizGarden</text>
</svg>
